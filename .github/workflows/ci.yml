name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Python deps for the kernel tests
        run: |
          python -m venv .testenv
          .testenv/bin/pip install --quiet ipykernel jupyter_client pandas matplotlib pyspark
      - run: npm ci
      - run: npm run test:unit
      - name: Kernel bridge tests
        run: .testenv/bin/python test/driver_test.py
      - name: Integration tests (real VS Code)
        run: xvfb-run -a -s "-screen 0 1600x1200x24" npm run test:integration
      - run: npx vsce package --no-dependencies
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"
